services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  checks:
    profiles: ["checks"]
    build:
      context: .
      target: checks
    environment:
      TEST_REDIS_URL: redis://redis-test:6379/0
    depends_on:
      redis-test:
        condition: service_healthy

  redis-test:
    profiles: ["checks"]
    image: redis:7.4.7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 15
